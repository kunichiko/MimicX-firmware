name: Firmware Release

# タグ v*.*.* を push したときに 3 つの env (joystick / x68k_keyboard / combined)
# を PlatformIO でビルドし、各 firmware.bin を GitHub Release に添付する。
#
# トリガ:
#   - push tag v*.*.*       : 通常リリース (Release 自動作成)
#   - workflow_dispatch     : 手動実行 (ビルドのみ、Release は作らない)
#   - pull_request to main  : ビルド検証のみ (Release は作らない)

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Node20 ベースの古いアクションを Node24 で動かす互換フラグ。アクション側の
  # メジャー更新が追いつかない場合の deprecation 警告を抑える。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [joystick, x68k_keyboard, combined]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Stage firmware artifact
        id: stage
        run: |
          mkdir -p dist
          # タグから v を取った値をバージョンとして埋め込む。タグなしビルド
          # (PR / workflow_dispatch) では "dev-<sha>" にする。
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          OUT="dist/mimicx_${{ matrix.env }}_${VERSION}.bin"
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: ${{ steps.stage.outputs.out }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # 注釈付きタグのメッセージを git tag -l --format='%(contents)' で読むため
        # フル履歴 + タグを取得する。shallow clone だと annotation が取れない場合がある。
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract tag annotation as release body
        id: notes
        # 注釈付きタグ (git tag -a -m "...") のメッセージをそのまま release body に流す。
        # Web フラッシャーは Releases API からこの body を読んでバージョン説明として表示する。
        # 軽量タグ or 注釈が空の場合は generate_release_notes にフォールバック。
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MSG=$(git tag -l --format='%(contents)' "$TAG")
          # 末尾の余分な改行を削る
          MSG=$(printf '%s' "$MSG" | sed -e :a -e '/^$/{$d;N;ba' -e '}')
          if [ -z "$MSG" ]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF_TAG_MSG'
              echo "$MSG"
              echo 'EOF_TAG_MSG'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.bin
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.fallback == 'true' }}
          draft: false
          prerelease: false

  deploy-to-pages:
    # Web フラッシャー (docs/firmware/firmwares/) に bin を同一オリジン配備する。
    # GitHub Release アセットの直 URL は CORS が効かないため、ブラウザの fetch は
    # 同じ GitHub Pages ドメイン配下 (kunichiko.github.io/...) からの取得が必須。
    # release job が Releases を作った後で main に bin を commit/push する。
    name: Deploy bins to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Download firmware artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Stage bins under docs/firmware/firmwares/
        run: |
          mkdir -p docs/firmware/firmwares
          cp artifacts/*.bin docs/firmware/firmwares/
          ls -la docs/firmware/firmwares/

      - name: Commit and push
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/firmwares/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "WebUSB フラッシャー: ${TAG} の bin を自動配備 [skip ci]"
            git push origin main
          fi
