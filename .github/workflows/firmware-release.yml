name: Firmware Release

# タグ v*.*.* を push したときに:
#   1. CH32 ファームを 3 variant ぶんビルド (standalone USB 版 + 2チップ I2C 版)
#   2. その I2C 版を内包した無線ファームを board × variant でビルド
#      (board = esp32 / esp32c6 / esp32c3、variant = joystick / keyboard / combined → 計 9)
#   3. すべての bin を GitHub Release に添付し、WebUSB フラッシャー用に Pages へ配備
#
# トリガ:
#   - push tag v*.*.*       : 通常リリース (Release 自動作成)
#   - workflow_dispatch     : 手動実行 (ビルドのみ、Release は作らない)
#   - pull_request to main  : ビルド検証のみ (Release は作らない)

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 0) 版数ゲート: タグ (vX.Y.Z) と単一ソース common/mimicx_version.h の一致を検査。
  #    不一致ならここで fail し、以降のビルド/リリースを止める。非タグ (PR /
  #    workflow_dispatch) では no-op で通す。ESP アプリ版数・CH32 FW 版数・内包
  #    照合版数はすべてこのヘッダ由来なので、タグと一致すれば 3 者すべて揃う。
  # ---------------------------------------------------------------------------
  verify-version:
    name: Verify version (tag == mimicx_version.h)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check tag matches mimicx_version.h
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "ℹ︎ 非タグビルド → 版数ゲートはスキップ"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/v}"
          H=platforms/common/mimicx_version.h
          MAJ=$(grep -oP 'MIMICX_VERSION_MAJOR\s+\K[0-9]+' "$H")
          MIN=$(grep -oP 'MIMICX_VERSION_MINOR\s+\K[0-9]+' "$H")
          PAT=$(grep -oP 'MIMICX_VERSION_PATCH\s+\K[0-9]+' "$H")
          VER="${MAJ}.${MIN}.${PAT}"
          echo "tag=v${TAG}  header=${VER}"
          if [[ "${TAG}" != "${VER}" ]]; then
            echo "::error::タグ (v${TAG}) と ${H} (${VER}) が不一致。両者を揃えてください"
            exit 1
          fi
          echo "✓ タグと mimicx_version.h が一致"

  # ---------------------------------------------------------------------------
  # 1) CH32 ファーム: standalone(USB直) + i2c(2チップ) を variant ごとにビルド
  # ---------------------------------------------------------------------------
  build-ch32:
    name: Build CH32 (${{ matrix.variant }})
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { variant: joystick, std_env: joystick,      i2c_env: joystick-i2c }
          - { variant: keyboard, std_env: x68k_keyboard, i2c_env: keyboard-i2c }
          - { variant: combined, std_env: combined,      i2c_env: combined-i2c }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platforms/ch32x035/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build standalone (${{ matrix.std_env }})
        run: pio run -d platforms/ch32x035 -e ${{ matrix.std_env }}

      - name: Build I2C (${{ matrix.i2c_env }})
        run: pio run -d platforms/ch32x035 -e ${{ matrix.i2c_env }}

      - name: Stage CH32 artifacts
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist ch32i2c
          # standalone (USB直) → Release / WebUSB フラッシャー用 (従来名を維持)
          cp "platforms/ch32x035/.pio/build/${{ matrix.std_env }}/firmware.bin" \
             "dist/mimicx_${{ matrix.std_env }}_${V}.bin"
          # i2c 版 → ESP32 ジョブが内包するための受け渡し (生 firmware.bin)
          cp "platforms/ch32x035/.pio/build/${{ matrix.i2c_env }}/firmware.bin" \
             "ch32i2c/firmware.bin"
          ls -la dist/ ch32i2c/

      - name: Upload CH32 standalone (release 用)
        uses: actions/upload-artifact@v7
        with:
          name: firmware-ch32-${{ matrix.variant }}
          path: dist/*.bin
          if-no-files-found: error

      - name: Upload CH32 i2c (ESP32 内包用 中間成果物)
        uses: actions/upload-artifact@v7
        with:
          name: ch32i2c-${{ matrix.variant }}
          path: ch32i2c/firmware.bin
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) ESP32 系 (無線) ファーム: CH32 i2c 版を内包して board × variant でビルド。
  #    board = esp32 (WROOM DevKit, Xtensa) / esp32c6 (XIAO, RISC-V)。ソースは
  #    platforms/esp32/main を共有し、C6 は platforms/esp32c6 プロジェクトから参照。
  #    esp-idf-ci-action の Docker は両アーキのツールチェーンを内蔵するので target
  #    を切り替えるだけでよい。
  # ---------------------------------------------------------------------------
  build-esp32:
    name: Build ${{ matrix.board.prefix }} (${{ matrix.variant }})
    needs: build-ch32
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [joystick, keyboard, combined]
        board:
          - { target: esp32,   path: platforms/esp32,   prefix: mimicx-esp32,   app: mimicx-esp32-ble.bin }
          - { target: esp32c6, path: platforms/esp32c6, prefix: mimicx-esp32c6, app: mimicx-esp32c6-ble.bin }
          - { target: esp32c3, path: platforms/esp32c3, prefix: mimicx-esp32c3, app: mimicx-esp32c3-ble.bin }
        include:
          - { variant: joystick, embed: ch32_joy_i2c.bin }
          - { variant: keyboard, embed: ch32_kbd_i2c.bin }
          - { variant: combined, embed: ch32_combo_i2c.bin }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CH32 i2c image (${{ matrix.variant }})
        uses: actions/download-artifact@v7
        with:
          name: ch32i2c-${{ matrix.variant }}
          path: ch32i2c

      - name: Embed CH32 image
        run: |
          # 内包イメージは共有コンポーネント platforms/esp32/main に置く (esp32 / esp32c6 共通)。
          cp ch32i2c/firmware.bin "platforms/esp32/main/${{ matrix.embed }}"
          ls -la "platforms/esp32/main/${{ matrix.embed }}"

      - name: Build ${{ matrix.board.target }} (variant=${{ matrix.variant }}) + merge-bin
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: ${{ matrix.board.target }}
          path: ${{ matrix.board.path }}
          command: >-
            idf.py -DMIMICX_CH32_VARIANT=${{ matrix.variant }} build &&
            idf.py -DMIMICX_CH32_VARIANT=${{ matrix.variant }} merge-bin -o merged.bin

      - name: Stage artifact
        run: |
          V="${{ steps.ver.outputs.version }}"
          P="${{ matrix.board.path }}"
          mkdir -p dist
          # merge-bin の出力は build/ 内 (0x0 から書ける統合イメージ。esptool / esp-web-tools 用)
          cp "$P/build/merged.bin" "dist/${{ matrix.board.prefix }}_${{ matrix.variant }}_${V}.bin"
          # 個別 app バイナリも参考用に同梱
          cp "$P/build/${{ matrix.board.app }}" \
             "dist/${{ matrix.board.prefix }}_${{ matrix.variant }}_${V}_app.bin" || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board.prefix }}-${{ matrix.variant }}
          path: dist/*.bin
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) GitHub Release: CH32 standalone + ESP32 の bin をまとめて添付
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-ch32, build-esp32]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: firmware-*       # firmware-ch32-* と firmware-esp32-* (中間 ch32i2c-* は除外)
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract tag annotation as release body
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MSG=$(git tag -l --format='%(contents)' "$TAG")
          MSG=$(printf '%s' "$MSG" | sed -e :a -e '/^$/{$d;N;ba' -e '}')
          if [ -z "$MSG" ]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF_TAG_MSG'
              echo "$MSG"
              echo 'EOF_TAG_MSG'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.bin
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.fallback == 'true' }}
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 4) WebUSB フラッシャー (docs/firmware/firmwares/) へ CH32 standalone bin を配備
  #    ※ ESP32 用 Web フラッシャーは将来対応 (merged bin は Release から取得可能)
  # ---------------------------------------------------------------------------
  deploy-to-pages:
    name: Deploy bins to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Download CH32 + ESP32 artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Stage bins under docs/firmware/firmwares/
        run: |
          mkdir -p docs/firmware/firmwares
          # CH32 standalone (mimicx_*) と 無線 merged (mimicx-esp32_* / mimicx-esp32c6_*) を
          # 同一オリジン配備。app 単体 (*_app.bin) は Web フラッシャーで使わないので除外 (Release のみ)。
          for f in artifacts/*.bin; do
            case "$(basename "$f")" in
              *_app.bin) ;;
              *) cp "$f" docs/firmware/firmwares/ ;;
            esac
          done
          ls -la docs/firmware/firmwares/

      - name: Commit and push
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/firmwares/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "WebUSB フラッシャー: ${TAG} の bin を自動配備 [skip ci]"
            git push origin main
          fi
